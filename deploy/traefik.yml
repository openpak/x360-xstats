# Merge into the primary's shared ~/openpak/deploy/traefik/dynamic.yml. The gateway forwards
# Live services 7, 34 and 35 (all of /xstats) here.
http:
  routers:
    x360-xstats-web:
      entryPoints: [web]
      rule: PathPrefix(`/xstats`)
      priority: 40
      service: x360-xstats-http
  services:
    x360-xstats-http:
      loadBalancer:
        servers:
        - url: http://openpak-x360-xstats:10007
